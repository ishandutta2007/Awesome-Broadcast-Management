<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Subtle Dynamic Animations in background elements */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    @keyframes barPulse {
      0%, 100% { height: 30px; y: 310px; }
      50% { height: 65px; y: 275px; }
    }
    .glow-circle { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .wave-line { stroke-dasharray: 20 10; animation: wave 30s linear infinite; }
    .bar-1 { animation: barPulse 2s ease-in-out infinite 0.1s; }
    .bar-2 { animation: barPulse 2.4s ease-in-out infinite 0.4s; }
    .bar-3 { animation: barPulse 1.8s ease-in-out infinite 0.2s; }
    .bar-4 { animation: barPulse 2.2s ease-in-out infinite 0.6s; }
    .bar-5 { animation: barPulse 2.6s ease-in-out infinite 0.3s; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="396" x="2" y="2" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Background Dynamic Graphic Elements (Positioned to NOT obscure text) -->
  <circle class="glow-circle" cx="1000" cy="100" r="180" fill="#6366f1" filter="blur(60px)" opacity="0.4" />
  <circle class="glow-circle" cx="150" cy="300" r="140" fill="#0284c7" filter="blur(50px)" opacity="0.3" />

  <!-- Background Signal Waves (Underneath Text) -->
  <path class="wave-line" d="M 0,200 Q 300,120 600,200 T 1200,200" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="4" />
  <path class="wave-line" d="M 0,220 Q 300,300 600,220 T 1200,220" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="3" />

  <!-- Decorative Equalizer Audio Visualizer (Bottom Right Corner) -->
  <g fill="#818cf8" opacity="0.6">
    <rect class="bar-1" x="980" y="310" width="10" height="30" rx="3" />
    <rect class="bar-2" x="1000" y="300" width="10" height="40" rx="3" />
    <rect class="bar-3" x="1020" y="280" width="10" height="60" rx="3" />
    <rect class="bar-4" x="1040" y="295" width="10" height="45" rx="3" />
    <rect class="bar-5" x="1060" y="315" width="10" height="25" rx="3" />
  </g>

  <!-- Foreground Content Container (Card Background) -->
  <rect x="60" y="50" width="1080" height="300" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Main Title & Subtitle (In Foreground) -->
  <g transform="translate(100, 125)">
    <!-- Radio/TV Broadcast Icon -->
    <path d="M0 12 A16 16 0 0 1 32 12 M-6 5 A24 24 0 0 1 38 5 M-12 -2 A32 32 0 0 1 44 -2" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" transform="translate(0, -10)" />
    <circle cx="16" cy="18" r="5" fill="#38bdf8" />
    
    <text x="60" y="15" class="title">Awesome Broadcast Management</text>
    <text x="60" y="55" class="subtitle">Curated Radio &amp; TV Automation, Playout, Traffic Scheduling &amp; MAM Ecosystem</text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(60, 100)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" />
      <text x="80" y="23" text-anchor="middle" class="badge-text">📻 Radio Automation</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="150" height="36" rx="18" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4" />
      <text x="250" y="23" text-anchor="middle" class="badge-text">📺 TV Playout</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="180" height="36" rx="18" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.4" />
      <text x="430" y="23" text-anchor="middle" class="badge-text">📊 Traffic &amp; Scheduling</text>

      <!-- Pill 4 -->
      <rect x="535" y="0" width="190" height="36" rx="18" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.4" />
      <text x="630" y="23" text-anchor="middle" class="badge-text">⚡ Media Asset Management</text>
    </g>
  </g>
</svg>
