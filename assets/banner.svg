<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes wave{0%{stroke-dashoffset:0}}@keyframes barPulse{0%{height:30px;y:310px}50%{height:65px;y:275px}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:52px;fill:url(#titleGrad)}.subtitle{font-weight:400;font-size:22px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.glow-circle{animation:pulse 6s ease-in-out infinite;transform-origin:center}.wave-line{stroke-dasharray:20 10;animation:wave 30s linear infinite}.bar-1{animation:barPulse 2s ease-in-out infinite .1s}.bar-2{animation:barPulse 2.4s ease-in-out infinite .4s}.bar-3{animation:barPulse 1.8s ease-in-out infinite .2s}.bar-4{animation:barPulse 2.2s ease-in-out infinite .6s}.bar-5{animation:barPulse 2.6s ease-in-out infinite .3s}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><rect width="1196" height="396" x="2" y="2" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2" rx="15"/><circle cx="1000" cy="100" r="180" fill="#6366f1" class="glow-circle" filter="blur(60px)" opacity=".4"/><circle cx="150" cy="300" r="140" fill="#0284c7" class="glow-circle" filter="blur(50px)" opacity=".3"/><path fill="none" stroke="#38bdf8" stroke-opacity=".15" stroke-width="4" d="M 0,200 Q 300,120 600,200 T 1200,200" class="wave-line"/><path fill="none" stroke="#818cf8" stroke-opacity=".15" stroke-width="3" d="M 0,220 Q 300,300 600,220 T 1200,220" class="wave-line"/><g fill="#818cf8" opacity=".6"><rect width="10" height="30" x="980" y="310" class="bar-1" rx="3"/><rect width="10" height="40" x="1000" y="300" class="bar-2" rx="3"/><rect width="10" height="60" x="1020" y="280" class="bar-3" rx="3"/><rect width="10" height="45" x="1040" y="295" class="bar-4" rx="3"/><rect width="10" height="25" x="1060" y="315" class="bar-5" rx="3"/></g><rect width="1080" height="300" x="60" y="50" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" stroke-width="1" rx="12"/><g transform="translate(100, 125)"><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="4" d="M0 12 A16 16 0 0 1 32 12 M-6 5 A24 24 0 0 1 38 5 M-12 -2 A32 32 0 0 1 44 -2" transform="translate(0, -10)"/><circle cx="16" cy="18" r="5" fill="#38bdf8"/><text x="60" y="15" class="title">Awesome Broadcast Management</text><text x="60" y="55" class="subtitle">Curated Radio &amp; TV Automation, Playout, Traffic Scheduling &amp; MAM Ecosystem</text><g transform="translate(60, 100)"><rect width="160" height="36" x="0" y="0" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".4" rx="18"/><text x="80" y="23" class="badge-text" text-anchor="middle">📻 Radio Automation</text><rect width="150" height="36" x="175" y="0" fill="#818cf8" fill-opacity=".15" stroke="#818cf8" stroke-opacity=".4" rx="18"/><text x="250" y="23" class="badge-text" text-anchor="middle">📺 TV Playout</text><rect width="180" height="36" x="340" y="0" fill="#c084fc" fill-opacity=".15" stroke="#c084fc" stroke-opacity=".4" rx="18"/><text x="430" y="23" class="badge-text" text-anchor="middle">📊 Traffic &amp; Scheduling</text><rect width="190" height="36" x="535" y="0" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-opacity=".4" rx="18"/><text x="630" y="23" class="badge-text" text-anchor="middle">⚡ Media Asset Management</text></g></g></svg>